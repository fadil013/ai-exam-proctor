name: CI

on:
  push:
  pull_request:

jobs:
  api-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api-server/go.mod
          cache-dependency-path: api-server/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
